# feed.toml
[database]
url = "sqlite:///feed.db"

# Spec success criterion 1 / phaseA-report A4: bound how far back a source's
# first fetch (or a fetch after a long gap) reaches. Per-source override
# lives on the source row (Source.max_backfill_days), not here -- see
# `feed sources add --max-backfill-days`.
[collect]
max_backfill_days = 2

[embedding]
backend = "auto"
# No explicit `model =` here, deliberately (C2 fix): resolve() only swaps
# in the fast CPU default (MiniLM) when the model field is left UNSET
# (feed/embedding/resolve.py checks model_fields_set, not the value). A
# pinned "BAAI/bge-small-en-v1.5" here used to survive onto every CPU
# machine, forcing the anomalously slow onnx+bge-small combination
# (measured 2.8 docs/s, ~6 min/1000 items, vs 89.6 docs/s for onnx+MiniLM)
# and silently stranding the 0.35 MiniLM threshold below, since
# threshold_for('BAAI/bge-small-en-v1.5') was never in merge_thresholds and
# fell back to the GPU-tuned global 0.50. Leaving model unset lets
# resolve() pick MiniLM on CPU and bge-small on CUDA, as designed. See
# tests/test_embedding.py::test_shipped_feed_toml_resolves_to_the_intended_cpu_profile.
device = "auto"
batch_size = 256

[clustering]
window_hours = 48
cosine_weight = 0.6
entity_weight = 0.4
merge_threshold = 0.50

# Per-model overrides: bge-small (GPU default) and MiniLM (CPU default) sit
# on different similarity scales, so one global merge_threshold cannot serve
# both. sentence-transformers/all-MiniLM-L6-v2's value below is the midpoint
# of the safe threshold band measured by tests/golden/test_golden.py
# (band low=0.30 high=0.40 width=0.10). See feed/config.py for details.
[clustering.merge_thresholds]
"sentence-transformers/all-MiniLM-L6-v2" = 0.35

# Issue 3: the off-topic relevance gate (feed/stages/relevance.py). Runs
# right after Tier 0 embedding, before clustering -- see RelevanceConfig's
# docstring in feed/config.py for the full design rationale (two cheap
# signals, bias toward keeping, rejections are visible via
# Item.reject_reason and `feed stats`, never silently discarded).
[relevance]
enabled = true
# Tuned against the shipped CPU default (MiniLM) using the actual Verge
# film review that prompted this fix (measured cosine 0.089 against the
# AI-topic reference centroid) and real AI/AI-adjacent stories from the
# same source class (measured 0.166-0.65) -- see
# tests/test_relevance_stage.py::test_rejects_the_verge_film_review and
# its sibling live test. 0.12 sits closer to the reject side of that gap
# than the midpoint would, so anything even loosely AI-adjacent clears it;
# per-model overrides go in [relevance.cosine_thresholds] below, mirroring
# [clustering.merge_thresholds].
cosine_threshold = 0.12
# One AI-vocabulary keyword hit is enough to call an item on-topic
# regardless of its embedding similarity (the "OR on keep" half of the
# bias-to-keep design).
min_keyword_hits = 1

[relevance.cosine_thresholds]

# Spec 3.5 LLM tiering. No secrets here -- every provider's key comes from
# the environment / gitignored .env via its own env_var below, never from
# this file.
[providers]
claude_code_timeout = 120.0
# Placeholder starting points per spec open questions 6/9.2 -- both need
# tuning once a live score distribution and observed Claude Code rate
# limits exist.
tier2_score_cut = 0.6
daily_budget = 20
# Bounded retry-with-backoff for transient (5xx/timeout/connection) errors
# before the failover chain advances to the next provider.
max_retries = 2
backoff_base = 0.5
# Consecutive 429s (not total) before a provider is skipped for the rest
# of the UTC day. A single 402 always disables immediately.
rate_limit_disable_threshold = 3

# BULK (Tier 1) failover chain -- priority is list order. Live-tested
# 2026-08-22 (measured, not from documentation or training data, both of
# which were wrong three times that day): Groq/Mistral/OpenRouter all 200
# OK; Gemini 503 on 3 of 4 attempts (kept, lower priority, as a fallback
# rather than removed); Cerebras 402 "Payment required" (implemented but
# disabled by default -- flip `enabled` once the account has credit).
[[providers.bulk]]
name = "groq"
kind = "openai_compatible"
model = "openai/gpt-oss-120b"
base_url = "https://api.groq.com/openai/v1"
env_var = "GROQ_API_KEY"
enabled = true
timeout = 30.0

[[providers.bulk]]
name = "mistral"
kind = "openai_compatible"
model = "mistral-medium-latest"
base_url = "https://api.mistral.ai/v1"
env_var = "MISTRAL_API_KEY"
enabled = true
timeout = 30.0

[[providers.bulk]]
name = "openrouter"
kind = "openai_compatible"
model = "nvidia/nemotron-3-ultra-550b-a55b:free"
base_url = "https://openrouter.ai/api/v1"
env_var = "OPENROUTER_API_KEY"
enabled = true
timeout = 30.0

[[providers.bulk]]
name = "gemini"
kind = "gemini"
# gemini-flash-latest is used deliberately over a pinned version (e.g.
# gemini-2.0-flash, which is now dead) so a future model retirement
# doesn't silently break this fallback rung.
model = "gemini-flash-latest"
env_var = "GEMINI_API_KEY"
enabled = true
timeout = 30.0

[[providers.bulk]]
name = "cerebras"
kind = "openai_compatible"
model = "gpt-oss-120b"
base_url = "https://api.cerebras.ai/v1"
env_var = "CEREBRAS_API_KEY"
# Measured 402 "Payment required" on 2026-08-22 -- disabled until the
# account has credit. Left configured (not deleted) so re-enabling is a
# one-line flip, not a rewrite.
enabled = false
timeout = 30.0

# Spec 4.1/4.4: the static bundle the Publish stage writes.
[publish]
out_dir = "public"
# How many days of NEWS the bundle carries. Story.updated_at derives from
# item.published_at (feed/stages/cluster.py), so this is the age of the
# event, not of the crawl. Overridable per-run without editing this file:
# `observatory.bat 7`, or `feed publish --days 7`.
#
# Nothing is destroyed by narrowing it -- the database keeps every story
# regardless, so raising this number and re-publishing brings the older
# ones straight back. Comfortably wider than [collect].max_backfill_days
# above, so consecutive daily runs keep the window full.
retention_days = 5
page_size = 50
