name: pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install project (dev extra)
        run: pip install -e ".[dev]"

      - name: Run tests (excluding slow / model-downloading tests)
        run: pytest -m "not slow"

  # C3 fix: spec S4.7 requires this workflow to run pytest "including the
  # golden-set clustering test", and S6 calls a regression there something
  # "no other test would catch". The `test` job above deliberately excludes
  # `@pytest.mark.slow` (which the golden test in tests/golden/test_golden.py
  # carries, since it downloads/runs a real embedding model), so on its own
  # that job never actually executes it. This second job runs exactly the
  # slow subset -- pytest's own -m expression, not a hand-picked file list,
  # so ANY test marked slow (not just today's golden tests) is covered by
  # construction -- in parallel with the fast job so a slow/flaky model
  # download never blocks the fast feedback loop. The HF/fastembed model
  # cache is keyed on the lockfile-equivalent (pyproject.toml) so repeat
  # runs skip the download entirely once warm, softening the "downloads a
  # model" cost the marker exists to isolate.
  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Cache downloaded embedding models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/fastembed
          key: ${{ runner.os }}-models-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-models-

      - name: Install project (dev extra)
        run: pip install -e ".[dev]"

      - name: Run slow tests (includes the golden-set clustering regression)
        run: pytest -m slow
