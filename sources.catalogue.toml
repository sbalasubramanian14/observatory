# NIST publishes no AI-specific feed (only a general newsroom feed exists;
# a ?topic=artificial-intelligence query param and several taxonomy-style
# URLs were tried and all silently ignored, returning the same
# unfiltered 40-item general feed -- verified live). Included anyway,
# at reduced authority, because it is a real, working, primary federal
# source and AI announcements do appear in it; the noise (facilities
# notices, unrelated program news) is the tradeoff, made explicit here
# rather than hidden. Stanford HAI (hai.stanford.edu, five URL variants
# tried) and every guessed whitehouse.gov / ai.gov / federalregister.gov
# feed (federalregister.gov additionally returned a bot-block page, not a
# 404) were NOT added -- no working feed found. See phaseC-report.md.
[[source]]
id = "nist"
plugin = "rss"
territory = "policy"
cadence_minutes = 240
authority = 0.5
config = { url = "https://www.nist.gov/news-events/news/rss.xml" }

