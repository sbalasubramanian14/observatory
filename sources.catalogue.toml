# Was the whole-site feed (rss/index.xml), which carries every Verge
# vertical -- film reviews, gadgets, culture -- not just AI. That let a
# horror-film review ("'We're All Going to the World's Fair' Debuts as
# Intimate Coming-of-Age Horror Film") into the AI feed, categorised
# OTHER, score 48. Swapped for the AI-specific feed (verified live
# 2026-08-23: 200 OK, 10 entries, all AI-topic). The relevance gate
# (feed/stages/relevance.py) is the second line of defense for whatever
# still slips through an AI-labelled feed.
config = { url = "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml" }

