# =============================================================================
# Anthropic -- ScraperSource proving ground.
#
# No RSS feed exists: https://www.anthropic.com/news/rss.xml,
# /rss.xml, /rss, /news.rss, /feed, /feed.xml all verified 404
# (curl, 2026-08-22). www.anthropic.com/news is server-rendered (not
# JS-only), so it is genuinely scrapable -- verified live: the
# "PublicationList" chronological item list on that page yields 10 items
# per load. robots.txt (www.anthropic.com/robots.txt) is "Allow: /" for
# all agents, so scraping is compliant.
# =============================================================================

[[source]]
id = "anthropic"
plugin = "scraper"
territory = "industry"
cadence_minutes = 180
authority = 0.9
config = { url = "https://www.anthropic.com/news", item_selector = 'a[class*="PublicationList"][class*="listItem"]', title_selector = '[class*="title"]', date_selector = "time" }

