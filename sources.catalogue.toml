# sources.catalogue.toml
#
# The checked-in list of every source this pipeline runs. `feed sources
# sync` reconciles the `source` table against this file -- add, edit, or
# remove a [[source]] block and re-run sync; that IS the operation. This
# replaces ad-hoc `feed sources add` calls (still available for one-off
# experiments, but no longer the source of truth).
#
# Every URL below was verified with a real HTTP request (curl) before
# being added here -- see .superpowers/sdd/phaseC-report.md for the full
# verification log, including every URL that was TRIED and did NOT work
# (six Anthropic RSS guesses, Cohere, Stability AI, four of seven Chinese
# labs, Groq, Cerebras, SemiAnalysis (429-blocked), Stanford HAI, and
# more). Do not re-guess those; the report has the list.
#
# territory is one of: research | industry | policy | infrastructure
# (spec 2's four coverage areas -- this catalogue is what closes the
# "policy and infrastructure are entirely uncovered" gap).
#
# Authority scheme (see phaseC-report.md for the full rationale): 0.85-0.9
# for a frontier lab's or a primary government body's own official
# channel; 0.7-0.8 for a respected-but-secondary primary source (smaller
# labs, official-but-marketing-flavored company blogs, thinner official
# feeds); 0.55-0.7 for trade press, PR/investor-relations feeds, and
# thin/sparse primary feeds; 0.4-0.55 for aggregators and general-purpose
# feeds with a lot of non-AI noise mixed in.

